- name: Find IP and check health of VM from hypervisor
  hosts: hypervisor
  become: false
  gather_facts: false
  tasks:
    - name: Check if deployment was successful
      shell: journalctl -u deploy-colt-vm.service | awk '/Finished/ && /colt/ && /deployment/'
      register: deployment_check
      failed_when: false

    - name: Stop playbook if deployment wasn't successful
      fail:
        msg: "Stopping playbook: colt vm deployment wasn't successful"
      when: deployment_check.stdout == ""

    - name: Get VM IPv4
      shell: virsh -c qemu:///system domifaddr colt-vm | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 1
      register: colt_vm_ip

    - name: Adding the colt vm with ProxyJump settings as an ansible host
      add_host:
        name: "colt_vm"
        ansible_host: "{{ colt_vm_ip.stdout.strip() }}"
        ansible_user: core
        ansible_ssh_private_key_file: "~/.ssh/colt"
        ansible_ssh_common_args: "-o ProxyJump=asarra@{{ inventory_hostname }}"

- name: Sets up the colt vm
  hosts: colt_vm
  become: false
  gather_facts: false
  tasks:
    - name: Waiting for connection
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Enabling and logging into tailscale
      shell: |
        systemctl enable tailscaled.service
        tailscale up --authkey "{{ lookup('file', './tskey-auth') | trim }}"
      become: true

    - name: Starting tailscale Serve
      command: systemctl start tailscale-serve.service
      become: true

    - name: See tailscale serve endpoints
      command: tailscale serve status
